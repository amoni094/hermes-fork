name: compaction-gate
version: "1.0.0"
description: >-
  Session-depth gate plus MDL fact scoring on pre_compress.
  Fail-open. Observability JSONL only; never blocks compression.
hooks:
  - pre_compress
provides_hooks:
  - pre_compress
settings:
  enabled: true
  depth_threshold: 50
  mdl_min_saving: 0.1
