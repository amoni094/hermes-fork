name: compaction-gate
version: "1.3.0"
description: >-
  Session-depth gate + MDL fact scoring on pre_compress.
  Writes compaction_telemetry via post_compaction to activate HHR branch.
  Extracts facts to SQLite (compaction_gate_facts) before lossy compression.
  Fail-open; never blocks compression.
hooks:
  - pre_compress
  - post_compaction
provides_hooks:
  - pre_compress
  - post_compaction
settings:
  enabled: true
  depth_threshold: 1100
  token_threshold: 100000
  mdl_min_saving: 0.1
  context_limit: 200000
